name: lsh
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # geo stack (conda-forge builds GDAL/rasterio cleanly)
  - gdal>=3.8
  - rasterio>=1.3.9
  - rioxarray>=0.15
  - xarray>=2024.1
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.6
  - h5py>=3.10
  - numpy>=1.26
  - scipy>=1.12
  - scikit-image>=0.22
  # data access
  - asf_search>=7.0
  - pystac-client>=0.7
  - planetary-computer>=1.0
  - odc-stac>=0.3.9
  - requests>=2.31
  - pyyaml>=6.0
  # api
  - fastapi>=0.110
  - uvicorn-standard>=0.27
  - rio-tiler>=6.4
  - orjson>=3.9
  # dev
  - pytest>=8.0
  - httpx>=0.27
  - ruff>=0.3
