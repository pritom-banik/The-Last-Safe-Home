# Synthetic site: generated by `python -m pipeline.cli demo`. Not real measurements.
id: demo
synthetic: true
name: { en: "Demo river (synthetic)", bn: "ডেমো নদী (কৃত্রিম)" }
# small AOI in the Meghna estuary area; the content is entirely synthetic
aoi_wkt: "POLYGON((90.60 22.60, 90.70 22.60, 90.70 22.70, 90.60 22.70, 90.60 22.60))"
utm_epsg: 32646
center: [90.65, 22.65]
zoom: 12
nisar:                          # ignored by the demo generator except known_gaps
  start: "2026-06-17"
  end: "2026-10-28"
  production_configuration: "PR"
  track: null
  known_gaps: [["2026-07-27", "2026-08-10"]]
landsat:                        # years used for synthetic bank lines
  years: [1988, 1993, 1998, 2003, 2008, 2013, 2018, 2023, 2026]
  months: [1, 2, 3]
  max_cloud: 40
analysis:
  grid_res_m: 30
  transect_spacing_m: 100
  transect_length_m: 4500            # demo river migrates ~1.9 km since 1988 (see DECISIONS)
  baseline_inset_m: 2500
  coherence_min: 0.4
  min_water_blob_px: 10
  speckle_filter_px: 5
score:
  weights: { erosion: 0.6, flood: 0.3, motion: 0.1 }
  t_full_risk_yr: 5
  t_no_risk_yr: 50
  motion_full_mm: 30
reference_area_wkt: null
validation: {}
