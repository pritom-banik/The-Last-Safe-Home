  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

      <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>The Last Safe Home</title>

        <div style="height:56px;background:#0f172a;color:#fff;display:flex;align-items:center;padding:0 16px;font-weight:600;font-size:18px">
          The Last Safe Home

        <div style="flex:1;background:#f2efe9;display:flex;align-items:center;justify-content:center;color:#475569;font-size:14px">
