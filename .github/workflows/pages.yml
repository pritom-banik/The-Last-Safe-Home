# Optional: deploy the web app to GitHub Pages (alternative to Vercel; SPEC §12). Run it by hand from the
# Actions tab once the API is deployed. Set the repository variable API_URL (e.g. https://<api-host>) first.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          test -n "$VITE_API_URL" || (echo "set the repository variable API_URL" && exit 1)
          npm ci --no-audit --no-fund
          npm run build
          cp dist/index.html dist/404.html   # SPA fallback for /method, /about, /report
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
